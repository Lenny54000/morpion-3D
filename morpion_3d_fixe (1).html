<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morpion 3D - 3×3×3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: white;
        }
        
        h1 {
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .instructions {
            background: rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
        }
        
        .game-info {
            background: rgba(255,255,255,0.2);
            padding: 15px 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            min-width: 300px;
        }
        
        .container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1400px;
        }
        
        .zone-2d {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        
        .zone-2d h2 {
            margin-bottom: 15px;
            text-align: center;
        }
        
        .grids-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .grid-2d {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .grid-2d h3 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 16px;
        }
        
        .grid-table {
            display: grid;
            grid-template-columns: repeat(3, 70px);
            grid-template-rows: repeat(3, 70px);
            gap: 5px;
            background: rgba(0,0,0,0.3);
            padding: 5px;
            border-radius: 10px;
        }
        
        .cell-2d {
            background: white;
            border: none;
            border-radius: 5px;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            color: #333;
        }
        
        .cell-2d:hover:not(:disabled) {
            background: #e0e0e0;
            transform: scale(1.05);
        }
        
        .cell-2d:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }
        
        .cell-2d.winning {
            background: #4CAF50 !important;
            color: white;
            animation: pulse 0.5s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .zone-3d {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        
        .zone-3d h2 {
            margin-bottom: 15px;
            text-align: center;
        }
        
        #canvas3d {
            border-radius: 10px;
            display: block;
        }
        
        .controls {
            margin-top: 20px;
            text-align: center;
        }
        
        button.new-game {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        
        button.new-game:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0,0,0,0.4);
        }
        
        .player-x { color: #2196F3; }
        .player-o { color: #FF5722; }
        
        @media (max-width: 768px) {
            .grid-table {
                grid-template-columns: repeat(3, 60px);
                grid-template-rows: repeat(3, 60px);
            }
            .cell-2d {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <h1>🎮 Morpion 3D - 3×3×3</h1>
    
    <div class="instructions">
        📋 2 joueurs en local • Cliquez sur les grilles pour jouer • Rotation corrigée !
    </div>
    
    <div class="game-info" id="gameInfo">
        Tour du joueur : <span class="player-x">X</span>
    </div>
    
    <div class="container">
        <div class="zone-2d">
            <h2>🎯 Zone de Jeu 2D</h2>
            <div class="grids-container" id="gridsContainer"></div>
        </div>
        
        <div class="zone-3d">
            <h2>🔮 Visualisation 3D</h2>
            <canvas id="canvas3d" width="500" height="500"></canvas>
            <div style="text-align: center; margin-top: 10px; font-size: 12px; opacity: 0.8;">
                🖱️ Glissez pour tourner • Molette pour zoomer
            </div>
        </div>
    </div>
    
    <div class="controls">
        <button class="new-game" onclick="nouvellePartie()">🔄 Nouvelle Partie</button>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let plateau = [];
        let joueurActuel = 'X';
        let partieTerminee = false;
        let ligneGagnante = null;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function initialiserPlateau() {
            plateau = [];
            for (let z = 0; z < 3; z++) {
                plateau[z] = [];
                for (let x = 0; x < 3; x++) {
                    plateau[z][x] = ['', '', ''];
                }
            }
            joueurActuel = 'X';
            partieTerminee = false;
            ligneGagnante = null;
        }
        
        function creerGrilles2D() {
            const container = document.getElementById('gridsContainer');
            container.innerHTML = '';
            
            for (let z = 0; z < 3; z++) {
                const gridDiv = document.createElement('div');
                gridDiv.className = 'grid-2d';
                
                const title = document.createElement('h3');
                title.textContent = `Niveau ${z + 1}`;
                gridDiv.appendChild(title);
                
                const table = document.createElement('div');
                table.className = 'grid-table';
                
                for (let y = 0; y < 3; y++) {
                    for (let x = 0; x < 3; x++) {
                        const cell = document.createElement('button');
                        cell.className = 'cell-2d';
                        cell.dataset.z = z;
                        cell.dataset.x = x;
                        cell.dataset.y = 2 - y;
                        cell.onclick = () => jouerCoup(z, x, 2 - y);
                        table.appendChild(cell);
                    }
                }
                
                gridDiv.appendChild(table);
                container.appendChild(gridDiv);
            }
        }
        
        function mettreAJourGrilles2D() {
            const cells = document.querySelectorAll('.cell-2d');
            cells.forEach(cell => {
                const z = parseInt(cell.dataset.z);
                const x = parseInt(cell.dataset.x);
                const y = parseInt(cell.dataset.y);
                
                cell.textContent = plateau[z][x][y];
                cell.disabled = plateau[z][x][y] !== '' || partieTerminee;
                cell.classList.remove('winning');
                
                if (ligneGagnante && ligneGagnante.some(pos => 
                    pos[0] === z && pos[1] === x && pos[2] === y
                )) {
                    cell.classList.add('winning');
                }
            });
        }
        
        function jouerCoup(z, x, y) {
            if (plateau[z][x][y] !== '' || partieTerminee) return;
            
            plateau[z][x][y] = joueurActuel;
            jouerSon();
            
            const gagnant = verifierVictoire();
            if (gagnant) {
                partieTerminee = true;
                document.getElementById('gameInfo').innerHTML = 
                    `🎉 Joueur <span class="player-${gagnant.toLowerCase()}">${gagnant}</span> gagne !`;
                mettreAJourGrilles2D();
                mettreAJourScene3D();
                return;
            }
            
            if (verifierMatchNul()) {
                partieTerminee = true;
                document.getElementById('gameInfo').textContent = '🤝 Match nul !';
                mettreAJourGrilles2D();
                return;
            }
            
            joueurActuel = joueurActuel === 'X' ? 'O' : 'X';
            document.getElementById('gameInfo').innerHTML = 
                `Tour du joueur : <span class="player-${joueurActuel.toLowerCase()}">${joueurActuel}</span>`;
            
            mettreAJourGrilles2D();
            mettreAJourScene3D();
        }
        
        function verifierVictoire() {
            const lignes = [];
            for (let z = 0; z < 3; z++) {
                for (let y = 0; y < 3; y++) lignes.push([[z,0,y], [z,1,y], [z,2,y]]);
                for (let x = 0; x < 3; x++) lignes.push([[z,x,0], [z,x,1], [z,x,2]]);
                lignes.push([[z,0,0], [z,1,1], [z,2,2]], [[z,0,2], [z,1,1], [z,2,0]]);
            }
            for (let x = 0; x < 3; x++) {
                for (let y = 0; y < 3; y++) lignes.push([[0,x,y], [1,x,y], [2,x,y]]);
                lignes.push([[0,x,0], [1,x,1], [2,x,2]], [[0,x,2], [1,x,1], [2,x,0]]);
            }
            for (let y = 0; y < 3; y++) {
                lignes.push([[0,0,y], [1,1,y], [2,2,y]], [[0,2,y], [1,1,y], [2,0,y]]);
            }
            lignes.push([[0,0,0], [1,1,1], [2,2,2]], [[0,0,2], [1,1,1], [2,2,0]],
                       [[0,2,0], [1,1,1], [2,0,2]], [[0,2,2], [1,1,1], [2,0,0]]);
            
            for (const ligne of lignes) {
                const [p1, p2, p3] = ligne;
                const v1 = plateau[p1[0]][p1[1]][p1[2]];
                const v2 = plateau[p2[0]][p2[1]][p2[2]];
                const v3 = plateau[p3[0]][p3[1]][p3[2]];
                if (v1 !== '' && v1 === v2 && v2 === v3) {
                    ligneGagnante = ligne;
                    return v1;
                }
            }
            return null;
        }
        
        function verifierMatchNul() {
            for (let z = 0; z < 3; z++)
                for (let x = 0; x < 3; x++)
                    for (let y = 0; y < 3; y++)
                        if (plateau[z][x][y] === '') return false;
            return true;
        }
        
        function nouvellePartie() {
            initialiserPlateau();
            creerGrilles2D();
            mettreAJourGrilles2D();
            document.getElementById('gameInfo').innerHTML = 'Tour du joueur : <span class="player-x">X</span>';
            initialiser3D();
        }
        
        function jouerSon() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 800;
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.1);
        }
        
        let scene, camera, renderer;
        let cubes3D = [];
        let ligneGagnante3D = null;
        
        function initialiser3D() {
            const canvas = document.getElementById('canvas3d');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a1a);
            camera = new THREE.PerspectiveCamera(50, 1, 0.1, 1000);
            camera.position.set(6, 6, 6);
            camera.lookAt(0, 0, 0);
            renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
            renderer.setSize(500, 500);
            
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const light = new THREE.DirectionalLight(0xffffff, 0.8);
            light.position.set(5, 5, 5);
            scene.add(light);
            
            creerStructure3D();
            ajouterControles();
            animer();
        }
        
        function creerStructure3D() {
            while(scene.children.length > 0) scene.remove(scene.children[0]);
            cubes3D = [];
            ligneGagnante3D = null;
            
            scene.add(new THREE.AmbientLight(0xffffff, 0.5));
            const l1 = new THREE.DirectionalLight(0xffffff, 0.8);
            l1.position.set(10, 10, 10);
            scene.add(l1);
            const l2 = new THREE.DirectionalLight(0x6666ff, 0.3);
            l2.position.set(-10, -10, -10);
            scene.add(l2);
            
            const esp = 1.5;
            const mat = new THREE.LineBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.4 });
            const size = 3 * esp, half = size / 2;
            const pts = [
                new THREE.Vector3(-half, -half, -half), new THREE.Vector3(half, -half, -half),
                new THREE.Vector3(half, -half, half), new THREE.Vector3(-half, -half, half),
                new THREE.Vector3(-half, -half, -half), new THREE.Vector3(-half, half, -half),
                new THREE.Vector3(half, half, -half), new THREE.Vector3(half, -half, -half),
                new THREE.Vector3(half, half, -half), new THREE.Vector3(half, half, half),
                new THREE.Vector3(half, -half, half), new THREE.Vector3(half, half, half),
                new THREE.Vector3(-half, half, half), new THREE.Vector3(-half, -half, half),
                new THREE.Vector3(-half, half, half), new THREE.Vector3(-half, half, -half)
            ];
            scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat));
            
            const planMat = new THREE.MeshPhongMaterial({ color: 0x1a1a2e, transparent: true, opacity: 0.1, side: THREE.DoubleSide });
            for (let i = -1; i <= 1; i++) {
                const plan = new THREE.Mesh(new THREE.PlaneGeometry(size, size), planMat);
                plan.position.set(i * esp, 0, 0);
                plan.rotation.y = Math.PI / 2;
                scene.add(plan);
            }
            
            for (let z = 0; z < 3; z++) {
                for (let x = 0; x < 3; x++) {
                    for (let y = 0; y < 3; y++) {
                        const px = (x - 1) * esp, py = (y - 1) * esp, pz = -(z - 1) * esp;
                        const val = plateau[z][x][y];
                        
                        if (val === '') {
                            const sph = new THREE.Mesh(
                                new THREE.SphereGeometry(0.1, 8, 8),
                                new THREE.MeshBasicMaterial({ color: 0x444444, transparent: true, opacity: 0.3 })
                            );
                            sph.position.set(px, py, pz);
                            scene.add(sph);
                        } else {
                            const grp = new THREE.Group();
                            if (val === 'X') {
                                const matX = new THREE.MeshPhongMaterial({ 
                                    color: 0x00d4ff, emissive: 0x0088ff, emissiveIntensity: 0.5, shininess: 100
                                });
                                const geo = new THREE.CylinderGeometry(0.08, 0.08, 1, 8);
                                const b1 = new THREE.Mesh(geo, matX);
                                b1.rotation.z = Math.PI / 4;
                                grp.add(b1);
                                const b2 = new THREE.Mesh(geo, matX);
                                b2.rotation.z = -Math.PI / 4;
                                grp.add(b2);
                                const halo = new THREE.Mesh(
                                    new THREE.SphereGeometry(0.6, 16, 16),
                                    new THREE.MeshBasicMaterial({ color: 0x00d4ff, transparent: true, opacity: 0.1 })
                                );
                                grp.add(halo);
                            } else {
                                const matO = new THREE.MeshPhongMaterial({ 
                                    color: 0xff4444, emissive: 0xff0000, emissiveIntensity: 0.5, shininess: 100
                                });
                                grp.add(new THREE.Mesh(new THREE.TorusGeometry(0.35, 0.1, 16, 32), matO));
                                const halo = new THREE.Mesh(
                                    new THREE.SphereGeometry(0.6, 16, 16),
                                    new THREE.MeshBasicMaterial({ color: 0xff4444, transparent: true, opacity: 0.1 })
                                );
                                grp.add(halo);
                            }
                            grp.position.set(px, py, pz);
                            scene.add(grp);
                            cubes3D.push(grp);
                        }
                    }
                }
            }
            
            if (ligneGagnante) dessinerLigneGagnante();
        }
        
        function dessinerLigneGagnante() {
            if (!ligneGagnante) return;
            const esp = 1.5;
            const pts = ligneGagnante.map(p => new THREE.Vector3((p[1] - 1) * esp, (p[2] - 1) * esp, -(p[0] - 1) * esp));
            const curve = new THREE.CatmullRomCurve3(pts);
            const tube = new THREE.Mesh(
                new THREE.TubeGeometry(curve, 20, 0.15, 8, false),
                new THREE.MeshPhongMaterial({ color: 0x00ff00, emissive: 0x00ff00, emissiveIntensity: 1, transparent: true, opacity: 0.9 })
            );
            ligneGagnante3D = tube;
            scene.add(tube);
            
            pts.forEach(pt => {
                const sph = new THREE.Mesh(
                    new THREE.SphereGeometry(0.25, 16, 16),
                    new THREE.MeshPhongMaterial({ color: 0x00ff00, emissive: 0x00ff00, emissiveIntensity: 1.5 })
                );
                sph.position.copy(pt);
                scene.add(sph);
            });
        }
        
        function mettreAJourScene3D() {
            creerStructure3D();
        }
        
        let isDragging = false;
        let prevMouse = { x: 0, y: 0 };
        let rotation = { x: 0, y: 0 };
        let distance = 10;
        const MAX_ANGLE = Math.PI / 2 - 0.1;
        const MIN_ANGLE = -Math.PI / 2 + 0.1;
        
        function ajouterControles() {
            const canvas = document.getElementById('canvas3d');
            
            canvas.addEventListener('mousedown', e => {
                isDragging = true;
                prevMouse = { x: e.clientX, y: e.clientY };
            });
            
            canvas.addEventListener('mousemove', e => {
                if (!isDragging) return;
                rotation.y -= (e.clientX - prevMouse.x) * 0.01;
                rotation.x += (e.clientY - prevMouse.y) * 0.01;
                rotation.x = Math.max(MIN_ANGLE, Math.min(MAX_ANGLE, rotation.x));
                prevMouse = { x: e.clientX, y: e.clientY };
            });
            
            canvas.addEventListener('mouseup', () => isDragging = false);
            
            canvas.addEventListener('wheel', e => {
                e.preventDefault();
                distance += e.deltaY * 0.01;
                distance = Math.max(5, Math.min(20, distance));
            });
            
            canvas.addEventListener('touchstart', e => {
                if (e.touches.length === 1) {
                    isDragging = true;
                    prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                }
            });
            
            canvas.addEventListener('touchmove', e => {
                if (!isDragging || e.touches.length !== 1) return;
                e.preventDefault();
                rotation.y -= (e.touches[0].clientX - prevMouse.x) * 0.01;
                rotation.x += (e.touches[0].clientY - prevMouse.y) * 0.01;
                rotation.x = Math.max(MIN_ANGLE, Math.min(MAX_ANGLE, rotation.x));
                prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            });
            
            canvas.addEventListener('touchend', () => isDragging = false);
        }
        
        function animer() {
            requestAnimationFrame(animer);
            camera.position.x = distance * Math.sin(rotation.y) * Math.cos(rotation.x);
            camera.position.y = distance * Math.sin(rotation.x);
            camera.position.z = distance * Math.cos(rotation.y) * Math.cos(rotation.x);
            camera.lookAt(0, 0, 0);
            
            cubes3D.forEach((obj, i) => {
                obj.rotation.y += 0.005;
                obj.position.y += Math.sin(Date.now() * 0.001 + i) * 0.0005;
            });
            
            if (ligneGagnante3D) {
                ligneGagnante3D.material.emissiveIntensity = 1 + Math.sin(Date.now() * 0.005) * 0.5;
            }
            
            renderer.render(scene, camera);
        }
        
        window.addEventListener('DOMContentLoaded', () => {
            initialiserPlateau();
            creerGrilles2D();
            mettreAJourGrilles2D();
            initialiser3D();
        });
    </script>
</body>
</html>
