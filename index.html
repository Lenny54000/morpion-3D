<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morpion 3D - 3×3×3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: white;
        }
        
        h1 {
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .instructions {
            background: rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
        }
        
        .game-info {
            background: rgba(255,255,255,0.2);
            padding: 15px 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            min-width: 300px;
        }
        
        .container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1400px;
        }
        
        .zone-2d {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        
        .zone-2d h2 {
            margin-bottom: 15px;
            text-align: center;
        }
        
        .grids-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .grid-2d {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .grid-2d h3 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 16px;
        }
        
        .grid-table {
            display: grid;
            grid-template-columns: repeat(3, 70px);
            grid-template-rows: repeat(3, 70px);
            gap: 5px;
            background: rgba(0,0,0,0.3);
            padding: 5px;
            border-radius: 10px;
        }
        
        .cell-2d {
            background: white;
            border: none;
            border-radius: 5px;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            color: #333;
        }
        
        .cell-2d:hover:not(:disabled) {
            background: #e0e0e0;
            transform: scale(1.05);
        }
        
        .cell-2d:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }
        
        .cell-2d.winning {
            background: #4CAF50 !important;
            color: white;
            animation: pulse 0.5s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .zone-3d {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        
        .zone-3d h2 {
            margin-bottom: 15px;
            text-align: center;
        }
        
        #canvas3d {
            border-radius: 10px;
            display: block;
        }
        
        .controls {
            margin-top: 20px;
            text-align: center;
        }
        
        button.new-game {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        
        button.new-game:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0,0,0,0.4);
        }
        
        .player-x { color: #2196F3; }
        .player-o { color: #FF5722; }
        
        @media (max-width: 768px) {
            .grid-table {
                grid-template-columns: repeat(3, 60px);
                grid-template-rows: repeat(3, 60px);
            }
            .cell-2d {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <!-- README / INSTRUCTIONS D'UTILISATION
    =====================================
    MORPION 3D - Jeu complet 3×3×3
    
    LANCEMENT:
    - Ouvrir ce fichier index.html dans un navigateur moderne (Chrome, Firefox, Edge, Safari)
    - Aucune installation ni compilation nécessaire
    
    RÈGLES:
    - 2 joueurs en local (X et O)
    - Cliquez sur les grilles 2D pour jouer
    - Gagnez en alignant 3 symboles en ligne, colonne, diagonale (2D ou 3D)
    - La visualisation 3D se met à jour automatiquement et montre la ligne gagnante
    
    COORDONNÉES:
    - Les grilles sont numérotées z=1, z=2, z=3 (niveau 1, 2, 3)
    - Chaque case est (z;x;y) avec x,y,z ∈ {1,2,3}
    
    DÉTECTION DE VICTOIRE TESTÉE:
    - 9 lignes horizontales par niveau (3 grilles × 3 lignes) ✓
    - 9 lignes verticales par niveau (3 grilles × 3 colonnes) ✓
    - 9 lignes traversant les niveaux verticalement (9 positions × 3 niveaux) ✓
    - 6 diagonales 2D (2 par grille × 3 grilles) ✓
    - 6 diagonales verticales (traversant les niveaux en diagonale) ✓
    - 4 grandes diagonales 3D (les diagonales principales du cube) ✓
    TOTAL: 49 lignes gagnantes possibles
    
    CAS LIMITES TRAITÉS:
    - Match nul (27 cases remplies sans gagnant)
    - Désactivation des clics après victoire
    - Mise à jour synchronisée 2D/3D
    - Surbrillance de la ligne gagnante dans les deux vues
    -->
    
    <h1>🎮 Morpion 3D - 3×3×3</h1>
    
    <div class="instructions">
        📋 Instructions : Ouvrir ce fichier HTML dans un navigateur • 2 joueurs en local • Cliquez sur les grilles 2D pour jouer
    </div>
    
    <div class="game-info" id="gameInfo">
        Tour du joueur : <span class="player-x">X</span>
    </div>
    
    <div class="container">
        <!-- Zone A : Grilles 2D -->
        <div class="zone-2d">
            <h2>🎯 Zone de Jeu 2D</h2>
            <div class="grids-container" id="gridsContainer"></div>
        </div>
        
        <!-- Zone B : Visualisation 3D -->
        <div class="zone-3d">
            <h2>🔮 Visualisation 3D</h2>
            <canvas id="canvas3d" width="500" height="500"></canvas>
            <div style="text-align: center; margin-top: 10px; font-size: 12px; opacity: 0.8;">
                🖱️ Glissez pour tourner • Molette pour zoomer
            </div>
        </div>
    </div>
    
    <div class="controls">
        <button class="new-game" onclick="nouvellePartie()">🔄 Nouvelle Partie</button>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ============================================
        // ÉTAT DU JEU
        // ============================================
        let plateau = []; // Structure 3D: plateau[z][x][y] avec z,x,y ∈ [0,1,2]
        let joueurActuel = 'X';
        let partieTerminee = false;
        let ligneGagnante = null;
        
        // Audio Context pour les sons
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // ============================================
        // INITIALISATION
        // ============================================
        function initialiserPlateau() {
            plateau = [];
            for (let z = 0; z < 3; z++) {
                plateau[z] = [];
                for (let x = 0; x < 3; x++) {
                    plateau[z][x] = ['', '', ''];
                }
            }
            joueurActuel = 'X';
            partieTerminee = false;
            ligneGagnante = null;
        }
        
        // ============================================
        // INTERFACE 2D
        // ============================================
        function creerGrilles2D() {
            const container = document.getElementById('gridsContainer');
            container.innerHTML = '';
            
            for (let z = 0; z < 3; z++) {
                const gridDiv = document.createElement('div');
                gridDiv.className = 'grid-2d';
                
                const title = document.createElement('h3');
                title.textContent = `Niveau ${z + 1} (z=${z + 1})`;
                gridDiv.appendChild(title);
                
                const table = document.createElement('div');
                table.className = 'grid-table';
                
                for (let y = 0; y < 3; y++) {
                    for (let x = 0; x < 3; x++) {
                        const cell = document.createElement('button');
                        cell.className = 'cell-2d';
                        cell.dataset.z = z;
                        cell.dataset.x = x;
                        cell.dataset.y = y;
                        cell.onclick = () => jouerCoup(z, x, y);
                        table.appendChild(cell);
                    }
                }
                
                gridDiv.appendChild(table);
                container.appendChild(gridDiv);
            }
        }
        
        function mettreAJourGrilles2D() {
            const cells = document.querySelectorAll('.cell-2d');
            cells.forEach(cell => {
                const z = parseInt(cell.dataset.z);
                const x = parseInt(cell.dataset.x);
                const y = parseInt(cell.dataset.y);
                
                cell.textContent = plateau[z][x][y];
                cell.disabled = plateau[z][x][y] !== '' || partieTerminee;
                
                // Retirer la classe winning d'abord
                cell.classList.remove('winning');
                
                // Ajouter la classe winning si la case fait partie de la ligne gagnante
                if (ligneGagnante && ligneGagnante.some(pos => 
                    pos[0] === z && pos[1] === x && pos[2] === y
                )) {
                    cell.classList.add('winning');
                }
            });
        }
        
        // ============================================
        // LOGIQUE DU JEU
        // ============================================
        function jouerCoup(z, x, y) {
            if (plateau[z][x][y] !== '' || partieTerminee) return;
            
            plateau[z][x][y] = joueurActuel;
            jouerSon();
            
            const gagnant = verifierVictoire();
            if (gagnant) {
                partieTerminee = true;
                document.getElementById('gameInfo').innerHTML = 
                    `🎉 Joueur <span class="player-${gagnant.toLowerCase()}">${gagnant}</span> gagne !`;
                mettreAJourGrilles2D();
                mettreAJourScene3D();
                return;
            }
            
            if (verifierMatchNul()) {
                partieTerminee = true;
                document.getElementById('gameInfo').textContent = '🤝 Match nul !';
                mettreAJourGrilles2D();
                return;
            }
            
            joueurActuel = joueurActuel === 'X' ? 'O' : 'X';
            document.getElementById('gameInfo').innerHTML = 
                `Tour du joueur : <span class="player-${joueurActuel.toLowerCase()}">${joueurActuel}</span>`;
            
            mettreAJourGrilles2D();
            mettreAJourScene3D();
        }
        
        function verifierVictoire() {
            // Toutes les lignes gagnantes possibles (49 au total)
            const lignes = [];
            
            // 1. Lignes horizontales sur chaque niveau (9 lignes)
            for (let z = 0; z < 3; z++) {
                for (let y = 0; y < 3; y++) {
                    lignes.push([[z,0,y], [z,1,y], [z,2,y]]);
                }
            }
            
            // 2. Lignes verticales sur chaque niveau (9 lignes)
            for (let z = 0; z < 3; z++) {
                for (let x = 0; x < 3; x++) {
                    lignes.push([[z,x,0], [z,x,1], [z,x,2]]);
                }
            }
            
            // 3. Diagonales 2D sur chaque niveau (6 lignes)
            for (let z = 0; z < 3; z++) {
                lignes.push([[z,0,0], [z,1,1], [z,2,2]]);
                lignes.push([[z,0,2], [z,1,1], [z,2,0]]);
            }
            
            // 4. Lignes verticales traversant les niveaux (9 lignes)
            for (let x = 0; x < 3; x++) {
                for (let y = 0; y < 3; y++) {
                    lignes.push([[0,x,y], [1,x,y], [2,x,y]]);
                }
            }
            
            // 5. Diagonales verticales (6 lignes)
            // Diagonales dans le plan xz (y constant)
            for (let y = 0; y < 3; y++) {
                lignes.push([[0,0,y], [1,1,y], [2,2,y]]);
                lignes.push([[0,2,y], [1,1,y], [2,0,y]]);
            }
            
            // 6. Diagonales verticales (6 lignes suite)
            // Diagonales dans le plan yz (x constant)
            for (let x = 0; x < 3; x++) {
                lignes.push([[0,x,0], [1,x,1], [2,x,2]]);
                lignes.push([[0,x,2], [1,x,1], [2,x,0]]);
            }
            
            // 7. Grandes diagonales 3D (4 lignes)
            lignes.push([[0,0,0], [1,1,1], [2,2,2]]);
            lignes.push([[0,0,2], [1,1,1], [2,2,0]]);
            lignes.push([[0,2,0], [1,1,1], [2,0,2]]);
            lignes.push([[0,2,2], [1,1,1], [2,0,0]]);
            
            // Vérifier chaque ligne
            for (const ligne of lignes) {
                const [pos1, pos2, pos3] = ligne;
                const val1 = plateau[pos1[0]][pos1[1]][pos1[2]];
                const val2 = plateau[pos2[0]][pos2[1]][pos2[2]];
                const val3 = plateau[pos3[0]][pos3[1]][pos3[2]];
                
                if (val1 !== '' && val1 === val2 && val2 === val3) {
                    ligneGagnante = ligne;
                    return val1;
                }
            }
            
            return null;
        }
        
        function verifierMatchNul() {
            for (let z = 0; z < 3; z++) {
                for (let x = 0; x < 3; x++) {
                    for (let y = 0; y < 3; y++) {
                        if (plateau[z][x][y] === '') return false;
                    }
                }
            }
            return true;
        }
        
        function nouvellePartie() {
            initialiserPlateau();
            creerGrilles2D();
            mettreAJourGrilles2D();
            document.getElementById('gameInfo').innerHTML = 
                'Tour du joueur : <span class="player-x">X</span>';
            initialiser3D();
        }
        
        // ============================================
        // SON
        // ============================================
        function jouerSon() {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.frequency.value = 800;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.1);
        }
        
        // ============================================
        // VISUALISATION 3D
        // ============================================
        let scene, camera, renderer, controls;
        let cubes3D = [];
        let ligneGagnante3D = null;
        
        function initialiser3D() {
            const canvas = document.getElementById('canvas3d');
            
            // Scène
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a1a);
            scene.fog = new THREE.Fog(0x0a0a1a, 8, 20);
            
            // Caméra
            camera = new THREE.PerspectiveCamera(50, 1, 0.1, 1000);
            camera.position.set(6, 6, 6);
            camera.lookAt(0, 0, 0);
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
            renderer.setSize(500, 500);
            
            // Lumières
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 5, 5);
            scene.add(directionalLight);
            
            // Créer la structure du cube 3×3×3
            creerStructure3D();
            
            // Contrôles de la souris
            ajouterControles();
            
            // Animer
            animer();
        }
        
        function creerStructure3D() {
            // Nettoyer les anciens objets
            while(scene.children.length > 0) { 
                scene.remove(scene.children[0]); 
            }
            cubes3D = [];
            ligneGagnante3D = null;
            
            // Réajouter les lumières
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            
            const directionalLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight1.position.set(10, 10, 10);
            scene.add(directionalLight1);
            
            const directionalLight2 = new THREE.DirectionalLight(0x6666ff, 0.3);
            directionalLight2.position.set(-10, -10, -10);
            scene.add(directionalLight2);
            
            // Créer la structure du cube avec un design moderne
            const espacementGrille = 1.5;
            
            // Structure externe du cube - lignes brillantes
            const lignesMaterial = new THREE.LineBasicMaterial({ 
                color: 0x00ffff,
                transparent: true,
                opacity: 0.4,
                linewidth: 2
            });
            
            // Dessiner les arêtes du cube principal
            const cubeSize = 3 * espacementGrille;
            const halfSize = cubeSize / 2;
            
            const edgesPoints = [
                // Base inférieure
                new THREE.Vector3(-halfSize, -halfSize, -halfSize),
                new THREE.Vector3(halfSize, -halfSize, -halfSize),
                new THREE.Vector3(halfSize, -halfSize, halfSize),
                new THREE.Vector3(-halfSize, -halfSize, halfSize),
                new THREE.Vector3(-halfSize, -halfSize, -halfSize),
                
                // Montée vers le haut
                new THREE.Vector3(-halfSize, halfSize, -halfSize),
                new THREE.Vector3(halfSize, halfSize, -halfSize),
                new THREE.Vector3(halfSize, -halfSize, -halfSize),
                new THREE.Vector3(halfSize, halfSize, -halfSize),
                new THREE.Vector3(halfSize, halfSize, halfSize),
                new THREE.Vector3(halfSize, -halfSize, halfSize),
                new THREE.Vector3(halfSize, halfSize, halfSize),
                new THREE.Vector3(-halfSize, halfSize, halfSize),
                new THREE.Vector3(-halfSize, -halfSize, halfSize),
                new THREE.Vector3(-halfSize, halfSize, halfSize),
                new THREE.Vector3(-halfSize, halfSize, -halfSize)
            ];
            
            const edgesGeometry = new THREE.BufferGeometry().setFromPoints(edgesPoints);
            const edgesLine = new THREE.Line(edgesGeometry, lignesMaterial);
            scene.add(edgesLine);
            
            // Grilles de séparation (plans semi-transparents)
            const planMaterial = new THREE.MeshPhongMaterial({
                color: 0x1a1a2e,
                transparent: true,
                opacity: 0.1,
                side: THREE.DoubleSide
            });
            
            // Plans verticaux
            for (let i = -1; i <= 1; i += 1) {
                const planGeo = new THREE.PlaneGeometry(cubeSize, cubeSize);
                const plan = new THREE.Mesh(planGeo, planMaterial);
                plan.position.set(i * espacementGrille, 0, 0);
                plan.rotation.y = Math.PI / 2;
                scene.add(plan);
            }
            
            // Créer les cases et symboles
            for (let z = 0; z < 3; z++) {
                for (let x = 0; x < 3; x++) {
                    for (let y = 0; y < 3; y++) {
                        const posX = (x - 1) * espacementGrille;
                        const posY = (y - 1) * espacementGrille;
                        const posZ = (z - 1) * espacementGrille;
                        
                        // Point lumineux pour chaque position vide
                        const valeur = plateau[z][x][y];
                        if (valeur === '') {
                            const sphereGeo = new THREE.SphereGeometry(0.1, 8, 8);
                            const sphereMat = new THREE.MeshBasicMaterial({
                                color: 0x444444,
                                transparent: true,
                                opacity: 0.3
                            });
                            const sphere = new THREE.Mesh(sphereGeo, sphereMat);
                            sphere.position.set(posX, posY, posZ);
                            scene.add(sphere);
                        } else {
                            const group = new THREE.Group();
                            
                            if (valeur === 'X') {
                                // X moderne avec effet néon
                                const materiau = new THREE.MeshPhongMaterial({ 
                                    color: 0x00d4ff,
                                    emissive: 0x0088ff,
                                    emissiveIntensity: 0.5,
                                    shininess: 100,
                                    specular: 0x4444ff
                                });
                                
                                const geo = new THREE.CylinderGeometry(0.08, 0.08, 1, 8);
                                
                                const barre1 = new THREE.Mesh(geo, materiau);
                                barre1.rotation.z = Math.PI / 4;
                                group.add(barre1);
                                
                                const barre2 = new THREE.Mesh(geo, materiau);
                                barre2.rotation.z = -Math.PI / 4;
                                group.add(barre2);
                                
                                // Halo lumineux
                                const haloGeo = new THREE.SphereGeometry(0.6, 16, 16);
                                const haloMat = new THREE.MeshBasicMaterial({
                                    color: 0x00d4ff,
                                    transparent: true,
                                    opacity: 0.1
                                });
                                const halo = new THREE.Mesh(haloGeo, haloMat);
                                group.add(halo);
                                
                            } else {
                                // O moderne avec effet néon
                                const materiau = new THREE.MeshPhongMaterial({ 
                                    color: 0xff4444,
                                    emissive: 0xff0000,
                                    emissiveIntensity: 0.5,
                                    shininess: 100,
                                    specular: 0xff4444
                                });
                                const geo = new THREE.TorusGeometry(0.35, 0.1, 16, 32);
                                const tore = new THREE.Mesh(geo, materiau);
                                group.add(tore);
                                
                                // Halo lumineux
                                const haloGeo = new THREE.SphereGeometry(0.6, 16, 16);
                                const haloMat = new THREE.MeshBasicMaterial({
                                    color: 0xff4444,
                                    transparent: true,
                                    opacity: 0.1
                                });
                                const halo = new THREE.Mesh(haloGeo, haloMat);
                                group.add(halo);
                            }
                            
                            group.position.set(posX, posY, posZ);
                            scene.add(group);
                            cubes3D.push(group);
                        }
                    }
                }
            }
            
            // Dessiner la ligne gagnante si elle existe
            if (ligneGagnante) {
                dessinerLigneGagnante();
            }
        }
        
        function dessinerLigneGagnante() {
            if (!ligneGagnante) return;
            
            const espacementGrille = 1.5;
            const points = ligneGagnante.map(pos => {
                const [z, x, y] = pos;
                return new THREE.Vector3(
                    (x - 1) * espacementGrille,
                    (y - 1) * espacementGrille,
                    (z - 1) * espacementGrille
                );
            });
            
            // Tube lumineux pour la ligne gagnante
            const curve = new THREE.CatmullRomCurve3(points);
            const tubeGeometry = new THREE.TubeGeometry(curve, 20, 0.15, 8, false);
            const tubeMaterial = new THREE.MeshPhongMaterial({ 
                color: 0x00ff00,
                emissive: 0x00ff00,
                emissiveIntensity: 1,
                shininess: 100,
                transparent: true,
                opacity: 0.9
            });
            
            ligneGagnante3D = new THREE.Mesh(tubeGeometry, tubeMaterial);
            scene.add(ligneGagnante3D);
            
            // Ajouter des sphères brillantes aux extrémités et au milieu
            points.forEach((point, index) => {
                const sphereGeo = new THREE.SphereGeometry(0.25, 16, 16);
                const sphereMat = new THREE.MeshPhongMaterial({ 
                    color: 0x00ff00,
                    emissive: 0x00ff00,
                    emissiveIntensity: 1.5,
                    shininess: 100
                });
                const sphere = new THREE.Mesh(sphereGeo, sphereMat);
                sphere.position.copy(point);
                scene.add(sphere);
                
                // Halo autour des sphères
                const haloGeo = new THREE.SphereGeometry(0.5, 16, 16);
                const haloMat = new THREE.MeshBasicMaterial({
                    color: 0x00ff00,
                    transparent: true,
                    opacity: 0.2
                });
                const halo = new THREE.Mesh(haloGeo, haloMat);
                halo.position.copy(point);
                scene.add(halo);
            });
            
            // Effet de particules autour de la ligne
            const particulesGeo = new THREE.BufferGeometry();
            const particulesPositions = [];
            const particulesColors = [];
            
            for (let i = 0; i < 100; i++) {
                const t = Math.random();
                const point = curve.getPoint(t);
                const offset = (Math.random() - 0.5) * 0.5;
                
                particulesPositions.push(
                    point.x + offset,
                    point.y + offset,
                    point.z + offset
                );
                
                particulesColors.push(0, 1, 0);
            }
            
            particulesGeo.setAttribute('position', 
                new THREE.Float32BufferAttribute(particulesPositions, 3));
            particulesGeo.setAttribute('color', 
                new THREE.Float32BufferAttribute(particulesColors, 3));
            
            const particulesMat = new THREE.PointsMaterial({
                size: 0.1,
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });
            
            const particules = new THREE.Points(particulesGeo, particulesMat);
            scene.add(particules);
        }
        
        function mettreAJourScene3D() {
            creerStructure3D();
        }
        
        // Contrôles de la souris simplifiés
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let rotation = { x: 0, y: 0 };
        let distance = 10;
        
        function ajouterControles() {
            const canvas = document.getElementById('canvas3d');
            
            canvas.addEventListener('mousedown', (e) => {
                isDragging = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });
            
            canvas.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;
                
                rotation.y -= deltaX * 0.01; // Inversé pour une rotation naturelle
                rotation.x += deltaY * 0.01;
                
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });
            
            canvas.addEventListener('mouseup', () => {
                isDragging = false;
            });
            
            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                distance += e.deltaY * 0.01;
                distance = Math.max(5, Math.min(20, distance));
            });
            
            // Support tactile
            canvas.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    isDragging = true;
                    previousMousePosition = { 
                        x: e.touches[0].clientX, 
                        y: e.touches[0].clientY 
                    };
                }
            });
            
            canvas.addEventListener('touchmove', (e) => {
                if (!isDragging || e.touches.length !== 1) return;
                e.preventDefault();
                
                const deltaX = e.touches[0].clientX - previousMousePosition.x;
                const deltaY = e.touches[0].clientY - previousMousePosition.y;
                
                rotation.y -= deltaX * 0.01; // Inversé pour une rotation naturelle
                rotation.x += deltaY * 0.01;
                
                previousMousePosition = { 
                    x: e.touches[0].clientX, 
                    y: e.touches[0].clientY 
                };
            });
            
            canvas.addEventListener('touchend', () => {
                isDragging = false;
            });
        }
        
        function animer() {
            requestAnimationFrame(animer);
            
            // Mettre à jour la position de la caméra
            camera.position.x = distance * Math.sin(rotation.y) * Math.cos(rotation.x);
            camera.position.y = distance * Math.sin(rotation.x);
            camera.position.z = distance * Math.cos(rotation.y) * Math.cos(rotation.x);
            camera.lookAt(0, 0, 0);
            
            // Animation des symboles (rotation légère)
            cubes3D.forEach((obj, index) => {
                obj.rotation.y += 0.005;
                // Effet de flottement
                obj.position.y += Math.sin(Date.now() * 0.001 + index) * 0.0005;
            });
            
            // Animation de la ligne gagnante
            if (ligneGagnante3D) {
                ligneGagnante3D.material.emissiveIntensity = 
                    1 + Math.sin(Date.now() * 0.005) * 0.5;
            }
            
            renderer.render(scene, camera);
        }
        
        // ============================================
        // DÉMARRAGE
        // ============================================
        window.addEventListener('DOMContentLoaded', () => {
            initialiserPlateau();
            creerGrilles2D();
            mettreAJourGrilles2D();
            initialiser3D();
        });
    </script>
</body>
